# Default values for reportnet.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Specific Values for orchestrator-service
resources:
  limits:
    #cpu: "100m"
    memory: 4Gi
  requests:
    #cpu: "100m"
    memory: 4Gi
# Environment Variables
consul:
  server: consul.reportnet.svc.cluster.local
  port: 8500

kafka:
  bootstrap: kafka.reportnet.svc.cluster.local
  port: 9092

redis:
    ip: redis.reportnet.svc.cluster.local
    port: 6379
    sentinel: masterset
    nodes: redis:26379
file:
    path: /reportnet3-data/input

orchestrator:
    curl: jdbc:postgresql://rn3-pg-helm-pgpool:5432/orchestrator_db
    user: postgres

tagSufix: 
replicas: 1
repo: eeacms
version: v3.3
# Other Variables
