# prometheus-values.yaml
server:
  # Persistent storage for metrics
  persistentVolume:
    storageClass: nfs-storage
    enabled: true
    size: 50Gi

  # Retention settings
  retention: "30d"

  # Resource allocation
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi

  # Service configuration
  service:
    type: NodePort
    nodePort: 30090

  # Global scrape interval
  global:
    scrape_interval: 15s
    evaluation_interval: 15s


    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
        

# Enable node-exporter for node metrics
prometheus-node-exporter:
  enabled: true
