# Enable kube-state-metrics for Kubernetes object metrics
kube-state-metrics:
  enabled: true

# Alertmanager configuration
alertmanager:
  enabled: true
  persistence:
    enabled: true
    size: 5Gi

# Push gateway for batch jobs
prometheus-pushgateway:
  enabled: false