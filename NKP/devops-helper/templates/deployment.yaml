apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.podName }}
  labels:
    app.kubernetes.io/name: {{ include "linux-pod.name" . }}
    helm.sh/chart: {{ include "linux-pod.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "linux-pod.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "linux-pod.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Always
      containers:
        - name: linux
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sleep
            - infinity
#          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath | default "/data" }}
#          {{- end }}
#          {{- if .Values.extraDisks.enabled }}
            - name: {{ .Values.extraDisks.name }}
              mountPath: {{ .Values.extraDisks.mountPath | default "/reportnet3-data/input" }}
#          {{- end }}
#          {{- if .Values.extraDisks1.enabled }}
            - name: {{ .Values.extraDisks1.name }}
              mountPath: {{ .Values.extraDisks1.mountPath | default "/reportnet3-pg-data0" }}
#          {{- end }}
#          {{- if .Values.extraDisks1.enabled }}
            - name: {{ .Values.extraDisks2.name }}
              mountPath: {{ .Values.extraDisks2.mountPath | default "/reportnet3-pg-data1" }}
#          {{- end }}
#          {{- if .Values.extraDisks1.enabled }}
            - name: {{ .Values.extraDisks3.name }}
              mountPath: {{ .Values.extraDisks1.mountPath | default "/reportnet3-pg-data2" }}
#          {{- end }}
#          {{- if .Values.extraDisks2.enabled }}
            - name: {{ .Values.extraDisks3.name }}
              mountPath: {{ .Values.extraDisks2.mountPath | default "/reportnet-data" }}
#          {{- end }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
      {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: devops-helper
      {{- end }}
      {{- if .Values.extraDisks.enabled }}
        - name: {{ .Values.extraDisks.name }}
          persistentVolumeClaim:
            claimName: {{ .Values.extraDisks.existingClaim }}
      {{- end }}
      {{- if .Values.extraDisks1.enabled }}
        - name: {{ .Values.extraDisks1.name }}
          persistentVolumeClaim:
            claimName: {{ .Values.extraDisks1.existingClaim }}
      {{- end }}
      {{- if .Values.extraDisks2.enabled }}
        - name: {{ .Values.extraDisks2.name }}
          persistentVolumeClaim:
            claimName: {{ .Values.extraDisks2.existingClaim }}
      {{- end }}
      {{- if .Values.extraDisks3.enabled }}
        - name: {{ .Values.extraDisks3.name }}
          persistentVolumeClaim:
            claimName: {{ .Values.extraDisks3.existingClaim }}
      {{- end }}
      {{- if .Values.extraDisks4.enabled }}
        - name: {{ .Values.extraDisks4.name }}
          persistentVolumeClaim:
            claimName: {{ .Values.extraDisks4.existingClaim }}
      {{- end }}

