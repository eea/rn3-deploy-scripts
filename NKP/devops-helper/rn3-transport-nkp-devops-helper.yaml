podName: devops-helper

image:
  repository: debian
  tag: trixie
  pullPolicy: IfNotPresent


persistence:
  enabled: true
  storageClassName: nutanix-file-static
  accessMode: 
    - ReadWriteMany
  size: 20Gi
  mountPath: /data


extraDisks:
  existingClaim: reportnet3-data
  mountPath: /reportnet3-data/input