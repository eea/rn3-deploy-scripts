podName: devops-helper

image:
  repository: debian
  tag: trixie
  pullPolicy: IfNotPresent


persistence:
  enabled: true
  storageClassName: nutanix-file-static
  accessMode: 
    - ReadWriteMany
  size: 20Gi
  mountPath: /data


extraDisks:
  enabled: true
  name: reportnet3-data
  storageClassName: "nfs-client"
  existingClaim: "reportnet3-data"
  mountPath: /reportnet3-data/input
  accessMode: 
    - ReadWriteMany

extraDisks1:
  enabled: false
  name: reportnet3-pg-data
  storageClassName: "nfs-client"
  existingClaim: "data-rn3-pg-helm-postgresql-0"
  mountPath: /reportnet3-pg-data
  accessMode: 
    - ReadWriteMany

extraDisks2:
  enabled: false
  name: reportnet-data
  storageClassName: "nfs-client"
  existingClaim: "reportnet-data"
  mountPath: /reportnet-data
  accessMode: 
    - ReadWriteMany