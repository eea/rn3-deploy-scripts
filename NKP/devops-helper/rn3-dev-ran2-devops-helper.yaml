podName: devops-helper

image:
  repository: debian
  tag: trixie
  pullPolicy: IfNotPresent

persistence:
  enabled: true
  storageClassName: "nfs-client"
  accessMode: 
    - ReadWriteMany

extraDisks:
  enabled: true
  name: reportnet3-data
  storageClassName: "nfs-client"
  existingClaim: "reportnet3-data"
  mountPath: /reportnet3-data/input
  accessMode: 
    - ReadWriteMany

extraDisks1:
  enabled: true
  name: reportnet3-pg-data0
  storageClassName: "nfs-client"
  existingClaim: "data-rn3-pg-helm-postgresql-0"
  mountPath: /reportnet3-pg-data0
  accessMode: 
    - ReadWriteMany

extraDisks2:
  enabled: true
  name: reportnet3-pg-data1
  storageClassName: "nfs-client"
  existingClaim: "data-rn3-pg-helm-postgresql-1"
  mountPath: /reportnet3-pg-data1
  accessMode: 
    - ReadWriteMany

extraDisks3:
  enabled: true
  name: reportnet3-pg-data2
  storageClassName: "nfs-client"
  existingClaim: "data-rn3-pg-helm-postgresql-2"
  mountPath: /reportnet3-pg-data2
  accessMode: 
    - ReadWriteMany


extraDisks4:
  enabled: true
  name: mongo
  storageClassName: "nfs-client"
  existingClaim: "datadir-mongo-mongodb-replicaset-0"
  mountPath: /mongo
  accessMode: 
    - ReadWriteMany


